<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hatzinikolaou Winery — Coming Soon</title>
  <meta name="description" content="Hatzinikolaou Winery, a family winery on Kos, Greece. Our new website is on its way.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%234a2545'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' fill='%23faf6f0' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple: #4a2545;
      --purple-deep: #341a30;
      --purple-bright: #6b3563;
      --purple-950: #1b0e18;
      --green: #4c6b3f;
      --green-deep: #34492b;
      --gold: #b98b3e;
      --cream: #f8f1e4;
      --paper: #fffdf9;
      --ink: #2a2126;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      color: var(--ink);
      font-family: "Cormorant Garamond", Georgia, "Palatino Linotype", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      background-color: var(--purple-950);
      background-image:
        radial-gradient(60% 50% at 50% 15%, rgba(107, 53, 99, 0.45), transparent 70%),
        linear-gradient(to bottom, var(--purple) 0%, var(--purple-deep) 45%, var(--purple-950) 100%);
    }

    main {
      position: relative;
      max-width: 620px;
      width: 100%;
      text-align: center;
      background: var(--paper);
      border: 1px solid #e8dcc4;
      border-radius: 4px;
      padding: clamp(32px, 7vw, 60px) clamp(22px, 6vw, 52px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }

    main::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(76, 107, 63, 0.35);
      border-radius: 2px;
      pointer-events: none;
    }

    .logo {
      display: block;
      width: min(360px, 82%);
      height: auto;
      margin: 6px auto 18px;
    }

    .place {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 0.76rem;
      color: var(--green-deep);
      margin: 0 0 22px;
      font-weight: 600;
    }

    /* A real motif (an olive branch, reused from the main site), not a
       generic rule — gives green its own moment between the identity
       block above and the message below, instead of one continuous
       column of text. */
    .branch {
      display: block;
      width: 84px;
      height: 42px;
      margin: 0 auto 26px;
      color: var(--green);
    }

    .tagline {
      font-family: "Caveat", cursive;
      font-size: clamp(1.8rem, 5vw, 2.3rem);
      color: var(--purple);
      margin: 0 0 20px;
      line-height: 1.2;
    }

    .message {
      max-width: 40ch;
      margin: 0 auto 22px;
      font-size: 1.25rem;
      line-height: 1.5;
      color: var(--ink);
    }

    .message-el {
      display: inline-block;
      max-width: 34ch;
      margin: 0 auto 32px;
      padding: 10px 20px;
      font-size: 1.05rem;
      font-style: italic;
      line-height: 1.45;
      color: var(--green-deep);
      background: rgba(76, 107, 63, 0.07);
      border-left: 2px solid var(--green);
      border-radius: 0 3px 3px 0;
      text-align: left;
    }

    .contact {
      margin: 0 0 22px;
    }

    .contact a {
      display: inline-block;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: #fff;
      background: var(--green);
      text-decoration: none;
      padding: 12px 26px;
      border-radius: 999px;
    }

    .contact a:hover,
    .contact a:focus-visible {
      background: var(--green-deep);
    }

    .contact-note {
      margin: 10px 0 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.82rem;
      color: #6b5f52;
    }

    footer {
      margin-top: 30px;
      padding-top: 22px;
      border-top: 1px solid #ede4d2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.74rem;
      letter-spacing: 0.02em;
      color: #6b5f52;
    }

    @media (prefers-contrast: more) {
      main { border-color: var(--ink); }
    }
  </style>
</head>
<body>
  <main>
    <picture>
      <source srcset="assets/logo.webp" type="image/webp">
      <img class="logo" src="assets/logo.png" alt="Hatzinikolaou Winery">
    </picture>

    <p class="place">Kos, Greece</p>

    <svg class="branch" viewBox="0 0 140 70" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
      <path d="M6 58 C40 50 70 40 134 12" stroke-linecap="round"/>
      <path d="M30 52 C34 42 30 34 20 30" stroke-linecap="round"/>
      <path d="M55 44 C61 34 58 25 48 20" stroke-linecap="round"/>
      <path d="M80 34 C87 25 84 16 74 11" stroke-linecap="round"/>
      <path d="M105 22 C112 14 109 7 100 4" stroke-linecap="round"/>
    </svg>

    <p class="tagline">Something is fermenting&hellip;</p>

    <p class="message">Our new website is on its way. Please check back soon.</p>
    <p class="message-el" lang="el">Ο νέος μας ιστότοπος έρχεται σύντομα.</p>

    <p class="contact">
      <a href="tel:+302242068921">Call +30 2242 068921</a>
    </p>
    <p class="contact-note">In the meantime, that's the fastest way to reach us.</p>

    <footer>
      Hatzinikolaou Winery · Platanaki O.E. · Kos, Greece
    </footer>
  </main>
</body>
</html>
